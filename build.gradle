plugins {
    id 'net.neoforged.moddev' version '2.0.42-beta'
    id 'maven-publish'
}

def mcTarget = providers.gradleProperty("mc_target")
        .orElse(providers.gradleProperty("minecraft_version"))
        .orElse("1.21.1")
        .get()
def loaderTarget = providers.gradleProperty("loader").orElse("neoforge").get().toLowerCase(Locale.ROOT)
def supportedLoaderPairs = [
        "1.20.1": ["fabric", "forge"],
        "1.21.1": ["neoforge", "fabric"],
        "26.1": ["neoforge", "fabric"],
        "26.2": ["neoforge", "fabric"],
        "26.3": ["neoforge", "fabric"]
]
if (!supportedLoaderPairs.containsKey(mcTarget)) {
    throw new GradleException("Unsupported mc_target '${mcTarget}'. Supported targets: ${supportedLoaderPairs.keySet().join(', ')}")
}
if (!supportedLoaderPairs[mcTarget].contains(loaderTarget)) {
    throw new GradleException("Unsupported loader '${loaderTarget}' for Minecraft ${mcTarget}. " +
            "Supported loaders: ${supportedLoaderPairs[mcTarget].join(', ')}")
}
def defaultBuild = mcTarget == "1.21.1" && loaderTarget == "neoforge"
def fabric1211Build = mcTarget == "1.21.1" && loaderTarget == "fabric"
def fabric1201Build = mcTarget == "1.20.1" && loaderTarget == "fabric"
def fabricBuild = fabric1211Build || fabric1201Build
def forge1201Build = mcTarget == "1.20.1" && loaderTarget == "forge"
if (!defaultBuild && !fabricBuild && !forge1201Build) {
    throw new GradleException(
            "The ${loaderTarget} ${mcTarget} profile is registered but not yet wired into this source tree. " +
            "Use the default NeoForge 1.21.1 profile while the platform adapter is being ported.")
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = "AliyunPublicMirror"; url = uri("https://maven.aliyun.com/repository/public") }
    maven { name = "TencentPublicMirror"; url = uri("https://mirrors.cloud.tencent.com/repository/maven-public") }
    maven { name = "NeoForged"; url = uri("https://maven.neoforged.net/releases") }
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = "XeroReiApi"; url = uri("https://maven.shedaniel.me") } }
        filter { includeGroup("me.shedaniel"); includeGroup("me.shedaniel.cloth") }
    }
    exclusiveContent {
        forRepository { maven { name = "XeroArchitecturyApi"; url = uri("https://maven.architectury.dev") } }
        filter { includeGroup("dev.architectury") }
    }
}

def mediaPlatform = providers.gradleProperty("media_platform").orElse(provider {
    def os = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    def arch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
    def cpu = arch.contains("aarch64") || arch.contains("arm64") ? "arm64" : "x86_64"
    if (os.contains("win")) return "windows-${cpu}"
    if (os.contains("mac")) return "macosx-${cpu}"
    return "linux-${cpu}"
}).get()

// The core never embeds media codecs. Basic audio uses Minecraft/Java Sound;
// optional codecs and their native binaries belong exclusively to xero_quest_media.
def maxModJarBytes = 5_000_000L
def withMediaMod = project.hasProperty('withMediaMod')
def javaCppVersion = '1.5.14'
def ffmpegVersion = '8.1.2-1.5.14'

configurations {
    mediaNative {
        transitive = false
    }
    javaCvSource {
        transitive = false
    }
    mediaApi {
        transitive = false
    }
}

def sanitizedJavaCv = tasks.register("sanitizedJavaCv", Jar) {
    archiveFileName = "javacv-1.5.14-nomod.jar"
    destinationDirectory = layout.buildDirectory.dir("sanitized")
    from({
        configurations.javaCvSource.collect { zipTree(it) }
    }) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/versions/**/module-info.class"
        exclude "module-info.class"
    }
}

sourceSets {
    // Loader-specific sources are kept outside the shared domain tree.
    main {
        java.srcDir("platforms/neoforge/1.21.1/java")
        resources.srcDir("platforms/neoforge/1.21.1/resources")
    }
    fabric {
        java.srcDir("platforms/fabric/1.21.1/java")
        resources.srcDir("platforms/fabric/1.21.1/resources")
    }
    forge {
        java.srcDir("platforms/forge/1.20.1/java")
        resources.srcDir("platforms/forge/1.20.1/resources")
    }
    media {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    smoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

