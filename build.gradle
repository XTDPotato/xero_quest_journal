def mediaMetadataFile = layout.buildDirectory.file('media-jarjar/metadata.json')
// Keep native resources beside their Java API: the loader's library layer cannot
// resolve resources stored only in the child mod layer.
def mediaLibraryJars = [javacpp: javaCppVersion, ffmpeg: ffmpegVersion].collectEntries { artifact, libraryVersion ->
    [(artifact): tasks.register("${artifact}MediaRuntime", Jar) {
        archiveFileName = "${artifact}-${libraryVersion}.jar"
        destinationDirectory = layout.buildDirectory.dir('media-runtime')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from({ configurations.mediaApi.findAll { it.name == "${artifact}-${libraryVersion}.jar" }.collect { zipTree(it) } })
        from({ configurations.mediaNative.findAll { it.name.startsWith("${artifact}-") }.collect { zipTree(it) } })
        exclude 'META-INF/MANIFEST.MF', '**/module-info.class', 'module-info.class'
        manifest.attributes('Automatic-Module-Name': "org.bytedeco.${artifact}")
    }]
}
def mediaMetadata = tasks.register('generateMediaJarJarMetadata') {
    outputs.file(mediaMetadataFile)
    inputs.property('javacppVersion', javaCppVersion)
    inputs.property('ffmpegVersion', ffmpegVersion)
    doLast {
        def output = mediaMetadataFile.get().asFile
        output.parentFile.mkdirs()
        def jars = [javacpp: javaCppVersion, ffmpeg: ffmpegVersion].collect { artifact, version ->
            [identifier: [group: 'org.bytedeco', artifact: artifact],
             version: [range: "[${version}]", artifactVersion: version],
             path: "META-INF/jarjar/${artifact}-${version}.jar", isObfuscated: false]
        }
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: jars]))
    }
}

// Optional client-side mod. The core has no static references to any codec classes.
def mediaNativeMod = tasks.register("mediaNativeMod", Jar) {
    dependsOn sanitizedJavaCv, mediaMetadata, mediaLibraryJars.values()
    archiveBaseName = "xero_quest_media"
    archiveVersion = project.version.toString()
    archiveClassifier = mediaPlatform
    destinationDirectory = layout.buildDirectory.dir("libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.media.output)
    from({ zipTree(sanitizedJavaCv.get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/maven/**', '**/module-info.class', 'module-info.class'
    }
    from(mediaLibraryJars.values().collect { it.flatMap { task -> task.archiveFile } }) { into 'META-INF/jarjar' }
    from(mediaMetadataFile) { into 'META-INF/jarjar' }
    from("docs/媒体模组安装.md")
    from("docs/MEDIA-NOTICES.txt")
}

tasks.register("verifyMediaAddonPackaging") {
    dependsOn mediaNativeMod
    inputs.file(mediaNativeMod.flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(mediaNativeMod.get().archiveFile.get().asFile).withCloseable { zip ->
            if (zip.entries().any { it.name.startsWith('org/bytedeco/javacpp/') && it.name.endsWith('.class')
                    || it.name.startsWith('org/bytedeco/ffmpeg/') && it.name.endsWith('.class') }) {
                throw new GradleException("Media native classifiers must not duplicate nested Java API classes")
            }
            for (path in ['xtdpotato/xero_quest_media/FfmpegMediaDecoder.class',
                          'org/bytedeco/javacv/FFmpegFrameGrabber.class', 'META-INF/jarjar/metadata.json']) {
                if (zip.getEntry(path) == null) throw new GradleException("Missing media companion entry: ${path}")
            }
            for (library in ["javacpp", "ffmpeg"]) {
                def libraryVersion = library == 'javacpp' ? javaCppVersion : ffmpegVersion
                def entry = zip.getEntry("META-INF/jarjar/${library}-${libraryVersion}.jar")
                if (entry == null) throw new GradleException("Missing media API: ${library}")
                boolean found = false
                new java.util.jar.JarInputStream(zip.getInputStream(entry)).withCloseable { nested ->
                    def child
                    while ((child = nested.nextJarEntry) != null) {
                        if (!child.directory && child.name.startsWith("org/bytedeco/${library}/${mediaPlatform}/")
                                && (child.name ==~ /(?i).*\.(dll|so(\..*)?|dylib|jnilib)$/)) found = true
                    }
                }
                if (!found) throw new GradleException("Missing ${library} natives beside its Java API")
            }
            if (zip.getEntry("META-INF/neoforge.mods.toml") == null) {
                throw new GradleException("Missing media companion mod descriptor")
            }
            logger.lifecycle("Media companion verified for ${mediaPlatform}; audio/video runtime retained")
        }
    }
}

tasks.register("verifyModSize") {
    dependsOn tasks.named("jar")
    inputs.file(tasks.named("jar").flatMap { it.archiveFile })
    doLast {
        def packaged = tasks.named("jar").get().archiveFile.get().asFile
        if (packaged.length() > maxModJarBytes) {
            throw new GradleException("Mod JAR is ${packaged.length()} bytes; limit is ${maxModJarBytes} bytes")
        }
        logger.lifecycle("Mod JAR: ${packaged.name}, ${packaged.length()} bytes (5 MB limit verified)")
    }
}

tasks.register("verifyMediaPackaging") {
    dependsOn tasks.named("jar")
    inputs.file(tasks.named("jar").flatMap { it.archiveFile })
    doLast {
        def packaged = tasks.named("jar").get().archiveFile.get().asFile
        new java.util.zip.ZipFile(packaged).withCloseable { zip ->
            def owners = [:]
            def recordPackage = { String path, String owner ->
                if (!path.endsWith(".class") || path.startsWith("META-INF/") || !path.contains("/")) return
                def pkg = path.substring(0, path.lastIndexOf("/"))
                def previous = owners.putIfAbsent(pkg, owner)
                if (previous != null && previous != owner) {
                    throw new GradleException("Split module package ${pkg}: ${previous} and ${owner}")
                }
            }
            zip.entries().each { entry ->
                recordPackage(entry.name, "xero_quest_journal")
                if (entry.name.startsWith("META-INF/jarjar/") && entry.name.endsWith(".jar")) {
                    new java.util.jar.JarInputStream(zip.getInputStream(entry)).withCloseable { nested ->
                        def child
                        while ((child = nested.nextJarEntry) != null) recordPackage(child.name, entry.name)
                    }
                }
            }
            if (owners.keySet().any { it.startsWith('org/bytedeco/') || it.startsWith('net/hacker/mediaplayer') }
                    || zip.entries().any { it.name.startsWith('org/bytedeco/')
                        || it.name.startsWith('META-INF/jarjar/ffmpeg-')
                        || it.name.startsWith('META-INF/jarjar/javacpp-') }) {
                throw new GradleException("Optional media libraries must not be embedded in the core JAR")
            }
            if (zip.entries().any {
                !it.directory && (it.name ==~ /(?i).*\.(dll|so(\..*)?|dylib|jnilib|exe)$/)
            }) throw new GradleException("Native binaries must not be embedded in the core JAR")
            logger.lifecycle("Core packaging verified: no split packages or optional media libraries")
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyMediaPackaging"), tasks.named("verifyModSize")
}

if (clientRegression) {
    tasks.named('runClient').configure {
        if (project.hasProperty('packagedMediaTest')) dependsOn mediaNativeMod
        doFirst {
            delete(layout.buildDirectory.file('verification/result.txt'))
            if (project.hasProperty('generateTasksTest') || project.hasProperty('tacticalCompatibilityTest')) {
                delete(layout.buildDirectory.file('verification/generated-task-documents.txt'))
                delete(layout.buildDirectory.file('verification/generated-spotlight-result.txt'))
            }
            if (project.hasProperty('packagedMediaTest')) {
                copy {
                    from(mediaNativeMod.get().archiveFile)
                    into('run-media-addon/mods')
                }
            }
            if (project.hasProperty('mediaPlayerTest')) {
                copy {
                    from('build/optional-mods/MediaPlayer-1.0.1.jar')
                    into('run-media-player/mods')
                }
            }
            if (project.hasProperty('localFfmpegTest')) {
                if (!project.hasProperty('local_ffmpeg')) throw new GradleException('Pass -Plocal_ffmpeg=<executable>')
                copy {
                    from(project.property('local_ffmpeg'))
                    into('run-media-ffmpeg/ffmpeg')
                }
            }
            if (project.hasProperty('controlGraphTest') && project.hasProperty('kubeJsTest')) {
                copy {
                    from('src/smoke/fixtures/kubejs/startup_scripts')
                    into('run-control-graphs-kubejs/kubejs/startup_scripts')
                }
            }
        }
        doLast {
            def result = layout.buildDirectory.file('verification/result.txt').get().asFile
            if (!result.exists() || !result.text.startsWith('PASS:')) {
                throw new GradleException(result.exists() ? result.text : 'Client smoke test did not produce a result')
            }
        }
    }
}
